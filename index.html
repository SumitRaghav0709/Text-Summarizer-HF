<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>

    <style>
        :root {
            color-scheme: light;
            --background: #fff8f1;
            --card: #ffffff;
            --text: #292524;
            --muted: #78716c;
            --accent: #ea580c;
            --accent-dark: #c2410c;
            --border: #e7e5e4;
            --summary: #fff7ed;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 16px;
            display: grid;
            place-items: center;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at top left, #ffedd5 0, transparent 42%),
                var(--background);
        }

        .container {
            width: min(100%, 680px);
            padding: clamp(24px, 5vw, 44px);
            background: var(--card);
            border: 1px solid rgba(231, 229, 228, 0.8);
            border-radius: 22px;
            box-shadow: 0 20px 55px rgba(124, 45, 18, 0.10);
        }

        h1 {
            margin: 0;
            text-align: center;
            color: var(--accent-dark);
            font-size: clamp(2rem, 6vw, 2.7rem);
            letter-spacing: -0.05em;
        }

        .subtitle {
            margin: 8px 0 28px;
            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .intro {
            margin: 0 0 12px;
            font-size: 0.95rem;
            font-weight: 600;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        textarea {
            width: 100%;
            min-height: 190px;
            resize: vertical;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: #fffdfb;
            color: var(--text);
            font: inherit;
            line-height: 1.6;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        textarea::placeholder {
            color: #a8a29e;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(234, 88, 12, 0.13);
        }

        button {
            min-height: 48px;
            padding: 12px 18px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: background 160ms ease, transform 160ms ease, box-shadow 160ms ease;
        }

        button:hover {
            background: var(--accent-dark);
            box-shadow: 0 8px 18px rgba(194, 65, 12, 0.2);
            transform: translateY(-1px);
        }

        button:focus-visible {
            outline: 3px solid rgba(234, 88, 12, 0.35);
            outline-offset: 3px;
        }

        button:active {
            transform: translateY(0);
        }

        .summary-output {
            min-height: 110px;
            margin-top: 24px;
            padding: 18px 20px;
            border: 1px solid #fed7aa;
            border-radius: 14px;
            background: var(--summary);
        }

        #summary-heading {
            margin: 0 0 10px;
            color: var(--accent-dark);
            font-size: 1rem;
        }

        #summary-text {
            margin: 0;
            color: #57534e;
            line-height: 1.65;
            overflow-wrap: anywhere;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px 12px;
            }

            .container {
                border-radius: 16px;
            }

            textarea {
                min-height: 160px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Text Summarizer</h1>
        <h3 class="subtitle">using HuggingFace Transformer</h3>

        <p class="intro">Write or paste your content below for a quick summary.</p>

        <form id="summarization-form">
            <textarea
                id="dialogue-input"
                placeholder="Enter your content here..."
                aria-label="Content to summarize"
                required
            ></textarea>
            <button type="submit">Summarize</button>
        </form>

        <section class="summary-output" aria-live="polite">
            <h2 id="summary-heading">Content Summary</h2>
            <p id="summary-text"></p>
        </section>
    </main>
    <script>
         document.getElementById("summarization-form").addEventListener("submit", async (e) => {
            e.preventDefault();
        
            const dialogueInput = document.getElementById("dialogue-input");
            const summaryText = document.getElementById("summary-text");
            const submitButton = e.target.querySelector("button");
        
            const dialogue = dialogueInput.value.trim();
            if (!dialogue) return;
        
            summaryText.innerText = "Processing...";
            submitButton.disabled = true;
        
            try {
                const response = await fetch("/summarize/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ dialogue }),
                });
        
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
        
                const data = await response.json();
                summaryText.innerText = data.summary || "No summary returned.";
            } catch (err) {
                
                summaryText.innerText = `Error: ${err.message}`;
            } finally {
                
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
